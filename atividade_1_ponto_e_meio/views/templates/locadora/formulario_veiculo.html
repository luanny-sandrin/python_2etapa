{% extends "layout.html" %}
{% block title %}Novo Veículo{% endblock %}

{% block content %}
<h1>Novo Veículo</h1>

<form method="POST" action="{{ url_for('locadora.cadastrar_veiculo') }}">
    <div class="form-grupo">
        <label>Placa</label>
        <input type="text" name="placa" placeholder="ABC-1234" required>
    </div>
    <div class="form-grupo">
        <label>Modelo</label>
        <input type="text" name="modelo" required>
    </div>
    <div class="form-grupo">
        <label>Diária (R$)</label>
        <input type="number" name="diaria" step="any" min="0" required>
    </div>
    <button type="submit">Salvar</button>
</form>

<p><a href="{{ url_for('locadora.listar_veiculos') }}">← Voltar</a></p>
{% endblock %}
