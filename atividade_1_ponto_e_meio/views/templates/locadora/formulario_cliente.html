{% extends "layout.html" %}
{% block title %}Novo Cliente{% endblock %}

{% block content %}
<h1>Novo Cliente</h1>

<form method="POST" action="{{ url_for('locadora.cadastrar_cliente') }}">
    <div class="form-grupo">
        <label>Nome</label>
        <input type="text" name="nome" required>
    </div>
    <div class="form-grupo">
        <label>CPF</label>
        <input type="text" name="cpf" placeholder="000.000.000-00" required>
    </div>
    <div class="form-grupo">
        <label>CNH</label>
        <input type="text" name="cnh" required>
    </div>
    <button type="submit">Salvar</button>
</form>

<p><a href="{{ url_for('locadora.listar_clientes') }}">← Voltar</a></p>
{% endblock %}
