<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Locadora{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="nav">
        <a href="{{ url_for('locadora.index') }}">Locações</a>
        <a href="{{ url_for('locadora.listar_clientes') }}">Clientes</a>

</html>
