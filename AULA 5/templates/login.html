<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Login da Escola</title>
</head>
<body>
    <div class="login">
        <h2>Faça seu Login</h2>
        
        {% if erro %}
            <p>{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <label>Usuário:</label><br>
            <input type="text" name="usuario" placeholder="Digite seu nome" required><br><br>
            
            <label>Senha:</label><br>
            <input type="password" name="senha" placeholder="Digite sua matrícula" required><br><br>
            
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
