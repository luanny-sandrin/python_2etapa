{% extends "base.html" %}

{% block conteudo %}

<h2>Editar Tarefa</h2>

<form method="POST">

<div class="mb-3">

<label>Título</label>

<input
class="form-control"
name="titulo"
value="{{ tarefa['titulo'] }}"
required>

</div>

<div class="mb-3">

<label>Descrição</label>

<textarea
class="form-control"
name="descricao">{{ tarefa['descricao'] }}</textarea>

</div>

<div class="mb-3">

<label>Status</label>

<select class="form-control" name="status">

<option {% if tarefa["status"]=="Pendente" %}selected{% endif %}>Pendente</option>

<option {% if tarefa["status"]=="Em andamento" %}selected{% endif %}>Em andamento</option>

<option {% if tarefa["status"]=="Concluída" %}selected{% endif %}>Concluída</option>

</select>

</div>

<button class="btn btn-warning">

Salvar alterações

</button>

</form>

{% endblock %}
