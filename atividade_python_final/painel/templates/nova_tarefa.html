{% extends "base.html" %}

{% block conteudo %}

<h2>Nova Tarefa</h2>

<form method="POST">

<div class="mb-3">

<label>Título</label>

<input
class="form-control"
name="titulo"
required>

</div>

<div class="mb-3">

<label>Descrição</label>

<textarea
class="form-control"
name="descricao">
</textarea>

</div>

<div class="mb-3">

<label>Status</label>

<select
class="form-control"
name="status">

<option>Pendente</option>

<option>Em andamento</option>

<option>Concluída</option>

</select>

</div>

<button class="btn btn-success">

Salvar

</button>

</form>

{% endblock %}
